<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make a Wish ✨ Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="aurora"></div>
    <div id="petals-container"></div>
    <main class="main-container">
        <header class="header">
            <div class="title-wrapper">
                <h1 class="title">Happy Birthday</h1>
                <span class="crown">👑</span>
            </div>
            <p class="subtitle">Tap the icing to add candles</p>
        </header>

        <div class="scene-wrapper">
            <div class="cake-scene">
                <div class="cake-bottom"></div>
                <div class="cake-body"></div>
                <div class="frosting-wrapper">
                    <div class="frosting-drips">
                        <div class="drip" style="left: 10px; width: 25px; height: 40px;"></div>
                        <div class="drip" style="left: 30px; width: 35px; height: 60px;"></div>
                        <div class="drip" style="left: 60px; width: 40px; height: 35px;"></div>
                        <div class="drip" style="left: 95px; width: 35px; height: 80px;"></div>
                        <div class="drip" style="left: 125px; width: 45px; height: 50px;"></div>
                        <div class="drip" style="left: 165px; width: 35px; height: 90px;"></div>
                        <div class="drip" style="left: 195px; width: 45px; height: 45px;"></div>
                        <div class="drip" style="left: 235px; width: 35px; height: 75px;"></div>
                        <div class="drip" style="left: 265px; width: 45px; height: 40px;"></div>
                    </div>
                    <div class="cake-top" id="cake-top">
                        <div id="candles-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass action-panel">
            <p id="status-msg" class="status-msg">Tap the icing to place candles ✨</p>
            <div class="btn-row">
                <button id="mic-btn" class="btn" disabled>🎤 Allow Mic</button>
                <button id="reset-btn" class="btn btn-ghost">↺ Reset</button>
            </div>
        </div>
        <p class="footer">Made with 💗 just for you</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
